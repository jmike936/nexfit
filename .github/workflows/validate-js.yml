name: Validate application scripts
on:
  pull_request:
    paths:
      - '**.js'
      - '**.html'
      - '**.json'
      - 'sw.js'
      - 'tests/js/**'
      - 'supabase/migrations/**'
      - '.github/workflows/validate-js.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check workout-personal-records.js
          node --test tests/js/workout-personal-records.test.js
          node --check workout-sync-core.js
          node --check musculacao.js
          node --test tests/js/training-management-lazy-load.test.js
          node --test tests/js/exercise-guidance.test.js
          node --test tests/js/workout-sync-core.test.js
          node --test tests/js/release-version.test.js
          node --check workout-history.js
          node --test tests/js/workout-history.test.js
          node --check exercise-evolution-core.js
          node --test tests/js/exercise-evolution-volume.test.js
          node --check evolution-periods.js
          node --test tests/js/evolution-periods.test.js
          node --check exercise-plateau.js
          node --test tests/js/exercise-plateau.test.js
          node --check exercise-evolution.js
          node --test tests/js/exercise-evolution.test.js
          node --test tests/js/exercise-personal-records.test.js
          node --test tests/js/exercise-evolution-trends.test.js
          node --check exercise-library.js
          node --test tests/js/exercise-library.test.js
          node --test tests/js/exercise-purpose-filter.test.js
          node --test tests/js/exercise-purpose-schema.test.js
          node --test tests/js/exercise-image-assets.test.js
          node --test tests/js/workout-catalog-picker.test.js
