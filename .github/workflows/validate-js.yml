name: Validate application scripts
on:
  pull_request:
    paths:
      - '**.js'
      - '**.html'
      - '**.json'
      - 'sw.js'
      - 'tests/js/**'
      - '.github/workflows/validate-js.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check workout-sync-core.js
          node --check musculacao.js
          node --test tests/js/exercise-guidance.test.js
          node --test tests/js/workout-sync-core.test.js
          node --test tests/js/release-version.test.js
          node --check workout-history.js
          node --check exercise-evolution.js
          node --test tests/js/exercise-evolution.test.js
          node --check exercise-library.js
          node --test tests/js/exercise-library.test.js
